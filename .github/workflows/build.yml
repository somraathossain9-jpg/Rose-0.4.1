name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip project
        run: unzip -q "rose-android-0.4.1 (1).zip" -d unzipped
      - name: Show unzipped files
        run: find unzipped | head -n 50
      - name: Find the project folder
        id: proj
        run: |
          f=$(find unzipped \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/node_modules/*' | hea
